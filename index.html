  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>20,000 Random English Words</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#0f0;
    padding:20px;
}
#words{
    white-space:pre-wrap;
    line-height:1.5;
}
</style>
</head>
<body>

<h2>مفاتيح مقترحه بأسم الذي بحثت عنه او حرف</h2>
<div id="words"></div>

<script>
const letters = "abcdefghijklmnopqrstuvwxyz";
const output = document.getElementById("words");

function randomWord() {
    let len = Math.floor(Math.random() * 8) + 3; // من 3 إلى 10 أحرف
    let word = "";
    for (let i = 0; i < len; i++) {
        word += letters[Math.floor(Math.random() * letters.length)];
    }
    return word;
}

let text = "";

for (let i = 1; i <= 10000; i++) {
    text += i + ". " + randomWord() + "\n";
}

output.textContent = text;
</script>

</body>
